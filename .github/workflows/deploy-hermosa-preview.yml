name: Deploy Hermosa Beach site
on:
  workflow_dispatch:
  push:
    branches:
      - feat/hermosa-beach-preview
    paths:
      - 'public/**'
      - worker.rendezvous-preview.js
      - wrangler.hermosabeach-site.jsonc
      - .github/workflows/deploy-hermosa-preview.yml
permissions:
  contents: read
concurrency:
  group: hermosa-beach-site
  cancel-in-progress: true
jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hermosa-beach-preview
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.hermosabeach-site.jsonc
