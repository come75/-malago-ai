name: Deploy Rendez-Vous Immo preview
on:
  push:
    branches:
      - feat/rendezvous-preview
    paths:
      - public/rendezvous.html
      - worker.rendezvous-preview.js
      - wrangler.rendezvous-preview.jsonc
      - .github/workflows/deploy-rendezvous-preview.yml
permissions:
  contents: read
concurrency:
  group: rendezvous-preview
  cancel-in-progress: true
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rendezvous-preview
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.rendezvous-preview.jsonc
