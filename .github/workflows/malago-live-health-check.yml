name: Malago live health check

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malago-live-health-check
  cancel-in-progress: true

jobs:
  check-live-worker:
    name: Check deployed Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live health endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://test.malago.workers.dev"
          HEALTH_URL="${BASE_URL}/health"
          healthy="false"

          for attempt in $(seq 1 12); do
            echo "Health check attempt ${attempt}/12"
            if curl --connect-timeout 10 --max-time 20 --fail --silent --show-error "$HEALTH_URL" -o health.json; then
              if jq -e '
                .ok == true
                and .aiConfigured == true
                and (
                  ((.notionRecords // 0) | tonumber) > 0
                  or (
                    ((.guideRecords // 0) | tonumber) > 0
                    and ((.resourceRecords // 0) | tonumber) > 0
                  )
                )
              ' health.json >/dev/null; then
                echo "Health endpoint returned a valid response:"
                jq '{ok, version, aiConfigured, notionConfigured, model, notionRecords, guideRecords, resourceRecords, notionError, dateMadrid}' health.json
                healthy="true"
                break
              fi
              echo "Health endpoint responded, but its payload did not pass validation:"
              cat health.json
            fi
            sleep 10
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::The live Worker health check failed after 12 attempts."
            exit 1
          fi

      - name: Check live website responds
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 30 --fail --silent --show-error \
            --output /dev/null \
            --write-out "Website HTTP status: %{http_code}\n" \
            "https://test.malago.workers.dev/"

      - name: Query Cloudflare Worker logs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID GitHub Actions secret."
            exit 1
          fi

          now_ms="$(date +%s%3N)"
          from_ms="$((now_ms - 24 * 60 * 60 * 1000))"

          cat > query.json <<EOF
          {
            "queryId": "malago-worker-logs-last-24h",
            "timeframe": {
              "from": ${from_ms},
              "to": ${now_ms}
            },
            "view": "events",
            "limit": 200,
            "parameters": {
              "datasets": ["cloudflare-workers"],
              "filterCombination": "and",
              "filters": [
                {
                  "key": "\$workers.scriptName",
                  "operation": "eq",
                  "type": "string",
                  "value": "test"
                }
              ]
            }
          }
          EOF

          http_code="$(curl --connect-timeout 10 --max-time 45 --silent --show-error \
            --output cloudflare-logs.json --write-out "%{http_code}" \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/query" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @query.json)"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cloudflare Observability API returned HTTP ${http_code}."
            jq '{success, errors, messages}' cloudflare-logs.json 2>/dev/null || cat cloudflare-logs.json
            exit 1
          fi

          if ! jq -e '.success == true' cloudflare-logs.json >/dev/null; then
            echo "::error::Cloudflare API did not confirm a successful log query."
            jq '{success, errors, messages}' cloudflare-logs.json
            exit 1
          fi

          echo "Cloudflare logs query succeeded for Worker test (last 24 hours)."
          jq '{
            success,
            returnedEvents: (.result.events.count // ((.result.events.events // []) | length)),
            returnedRows: ((.result.events.events // []) | length),
            eventFieldNames: (if ((.result.events.events // []) | length) > 0 and ((.result.events.events[0] | type) == "object") then (.result.events.events[0] | keys) else [] end),
            metadataFieldNames: (if ((.result.events.events // []) | length) > 0 and ((.result.events.events[0]["$metadata"] | type) == "object") then (.result.events.events[0]["$metadata"] | keys) else [] end),
            workerFieldNames: (if ((.result.events.events // []) | length) > 0 and ((.result.events.events[0]["$workers"] | type) == "object") then (.result.events.events[0]["$workers"] | keys) else [] end),
            levels: ([.result.events.events[]? | (.["$metadata"].level // "unknown" | tostring)] | group_by(.) | map({level: .[0], count: length})),
            outcomes: ([.result.events.events[]? | (.["$workers"].outcome // "unknown" | tostring)] | group_by(.) | map({outcome: .[0], count: length})),
            errorLikeEvents: ([
              .result.events.events[]?
              | select(
                  ((.["$metadata"].level? // "" | tostring | ascii_downcase) | test("error|fatal|exception"))
                  or (.["$metadata"].error? != null and (.["$metadata"].error? | tostring) != "")
                  or ((.["$workers"].outcome? // "unknown" | tostring | ascii_downcase) != "ok")
                )
            ] | length),
            statistics: (.result.statistics // null)
          }' cloudflare-logs.json > cloudflare-summary.json

          cat cloudflare-summary.json

          returned_events="$(jq -r '.returnedEvents // 0' cloudflare-summary.json)"
          error_count="$(jq -r '.errorLikeEvents // 0' cloudflare-summary.json)"
          info_count="$(jq -r '[.levels[]? | select((.level | ascii_downcase) == "info") | .count] | add // 0' cloudflare-summary.json)"
          ok_count="$(jq -r '[.outcomes[]? | select((.outcome | ascii_downcase) == "ok") | .count] | add // 0' cloudflare-summary.json)"

          {
            echo "### Malago Worker telemetry"
            echo
            echo "- Worker: `test`"
            echo "- Window: last 24 hours"
            echo "- Events returned: ${returned_events}"
            echo "- Info-level events: ${info_count}"
            echo "- Successful outcomes: ${ok_count}"
            echo "- Events matching error indicators: ${error_count}"
            echo
            echo "_The error count is a heuristic over returned telemetry events, not a guarantee that all possible runtime errors are captured._"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$error_count" -gt 0 ]; then
            echo "::error::Cloudflare telemetry contains ${error_count} event(s) matching common error indicators in the last 24 hours."
            exit 1
          fi

          echo "No events matched the current common error indicators. This does not prove that no runtime errors occurred."
