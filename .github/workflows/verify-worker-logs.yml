name: Verify Malago Worker logs

on:
  workflow_dispatch:
  push:
    branches:
      - v7-real-site
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/verify-worker-logs.yml"

permissions:
  contents: read

jobs:
  verify-worker-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Capture a real Worker invocation without printing raw logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/malago-worker-tail.jsonl"
          SUMMARY_FILE="$RUNNER_TEMP/malago-worker-log-summary.txt"
          : > "$LOG_FILE"

          npx --yes wrangler@4 tail test --format json --sampling-rate 1 >"$LOG_FILE" 2>&1 &
          TAIL_PID=$!
          cleanup() {
            kill "$TAIL_PID" 2>/dev/null || true
            wait "$TAIL_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Wait for tail to connect before generating a known request.
          sleep 12
          HTTP_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}' https://test.malago.workers.dev/health || true)"
          echo "Health endpoint HTTP status: ${HTTP_CODE:-unknown}"
          test "$HTTP_CODE" = "200" || { echo "::error::Worker health endpoint did not return HTTP 200"; exit 1; }

          sleep 8
          cleanup
          trap - EXIT

          # Never print raw Worker logs: they may contain user or operational data.
          # Report only counts and whether the known health invocation appeared.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/malago-worker-tail.jsonl', 'utf8');
          const lines = raw.split(/\r?\n/).filter(Boolean);
          let parsed = 0, healthMatches = 0, errors = 0, exceptions = 0;
          for (const line of lines) {
            try {
              const item = JSON.parse(line);
              parsed++;
              const text = JSON.stringify(item);
              if (text.includes('/health')) healthMatches++;
              if (item.outcome === 'exception' || item.status === 'error') errors++;
              if (Array.isArray(item.exceptions)) exceptions += item.exceptions.length;
            } catch {}
          }
          console.log('Cloudflare tail returned structured log records: ' + parsed);
          console.log('Records matching the test /health request: ' + healthMatches);
          console.log('Error outcomes observed: ' + errors);
          console.log('Exceptions observed: ' + exceptions);
          if (parsed === 0 || healthMatches === 0) {
            console.error('::error::No real Cloudflare log record for the test invocation was retrieved.');
            process.exit(1);
          }
          NODE
