name: Deploy Rendez-Vous Immo domain route
on:
  workflow_dispatch:
  push:
    branches:
      - deploy/rendezvous-domain
    paths:
      - worker.rendezvous-route.js
      - wrangler.rendezvous-route.jsonc
      - .github/workflows/deploy-rendezvous-domain.yml
permissions:
  contents: read
concurrency:
  group: rendezvous-domain-route
  cancel-in-progress: false
jobs:
  deploy-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/rendezvous-domain
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.rendezvous-route.jsonc
