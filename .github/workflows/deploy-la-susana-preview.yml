name: Deploy La Susana preview
on:
  push:
    branches:
      - feat/la-susana-site
    paths:
      - public/villa-magos.html
      - public/villa-la-susana.html
      - .github/workflows/deploy-la-susana-preview.yml
      - 4C2C83BE-F311-497B-80E1-B1B28A9F5040.png
      - worker.js
      - wrangler.la-susana-preview.jsonc
permissions:
  contents: read
concurrency:
  group: la-susana-preview
  cancel-in-progress: true
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/la-susana-site
      - name: Copy uploaded DJ photo into public assets
        run: cp 4C2C83BE-F311-497B-80E1-B1B28A9F5040.png public/4C2C83BE-F311-497B-80E1-B1B28A9F5040.png
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.la-susana-preview.jsonc
