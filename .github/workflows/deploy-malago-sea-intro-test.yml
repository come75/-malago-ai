name: Deploy Malago sea intro to test

# Manual retry trigger after updating the test Account ID secret.
on:
  push:
    branches:
      - feat/malago-sea-intro
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malago-test-deploy-sea-intro
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Deploy test Worker only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/malago-sea-intro

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          npx --yes wrangler@4 deploy --config wrangler.jsonc
