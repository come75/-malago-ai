name: Deploy Malago test Worker (temporary rollback)

on:
  push:
    branches:
      - feat/malago-sea-intro
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malago-test-deploy-sea-intro
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Deploy test Worker only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/malago-sea-intro
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy reverted test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@4 deploy --config wrangler.jsonc
