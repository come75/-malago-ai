name: Legacy Villa Magos deployment guard
on:
  workflow_dispatch:
jobs:
  block-obsolete-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Stop obsolete deployment from main
        shell: bash
        run: |
          echo "::error::This legacy workflow is intentionally blocked."
          echo "Villa Magos must be deployed from fix/villamagos-partner-prefix-domain,"
          echo "which uses the dedicated malago-villamagos Worker and its own D1 database."
          echo "Do not deploy main/worker.js to the shared test Worker from this workflow."
          exit 1
