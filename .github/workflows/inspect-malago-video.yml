name: Inspect Malago video

on:
  push:
    paths:
      - "public/media/malago-ai.MP4"
      - ".github/workflows/inspect-malago-video.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -show_entries format=duration,size,bit_rate,format_name -show_entries stream=index,codec_type,codec_name,codec_long_name,profile,level,width,height,pix_fmt,r_frame_rate,avg_frame_rate,color_space,color_transfer,color_primaries -of json public/media/malago-ai.MP4
