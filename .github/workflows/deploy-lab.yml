name: Deploy Malago lab (test)
# Site de test isolé : malago-lab.malago.workers.dev. N'affecte aucun site partenaire.
on:
  workflow_dispatch:
  push:
    branches:
      - 'lab/**'
permissions:
  contents: read
concurrency:
  group: malago-lab
  cancel-in-progress: true
jobs:
  deploy-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.lab.jsonc
